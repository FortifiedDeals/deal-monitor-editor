<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deal Monitor — Watchlist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
  :root {
    --bg: #F6F4F0;
    --surface: #FFFFFF;
    --surface-2: #FBF9F6;
    --ink: #1D2027;
    --ink-soft: #63676F;
    --border: #DEDAD2;
    --accent: #C2660A;
    --accent-ink: #FFFFFF;
    --danger: #B3261E;
    --danger-bg: #FBEAE9;
    --success: #1E7B34;
    --success-bg: #EAF6EC;
    --focus: #2563EB;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171B;
      --surface: #1D2026;
      --surface-2: #23262D;
      --ink: #EDEBE6;
      --ink-soft: #A3A7AF;
      --border: #33363D;
      --accent: #E08A2E;
      --accent-ink: #1D2026;
      --danger: #F16A61;
      --danger-bg: #2E1B1A;
      --success: #4ADE80;
      --success-bg: #16281C;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 100px; }
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    padding: 20px 0 14px;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .status { font-size: 13px; color: var(--ink-soft); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .status.connected::before { content: "● "; color: var(--success); }
  .status.disconnected::before { content: "● "; color: var(--ink-soft); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-top: 16px;
  }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }

  label { display: block; font-size: 13px; color: var(--ink-soft); margin: 12px 0 4px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=number], select {
    width: 100%;
    padding: 10px 11px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface-2);
    color: var(--ink);
  }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .check-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .check-row input { width: 18px; height: 18px; }
  .check-row label { margin: 0; font-size: 14px; color: var(--ink); }

  .item-card { position: relative; }
  .item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .item-top input[type=text] { font-weight: 600; border: none; background: transparent; padding: 0; font-size: 16px; }
  .del-btn {
    background: none; border: none; color: var(--danger); font-size: 13px;
    cursor: pointer; padding: 4px 8px; border-radius: 6px; flex-shrink: 0;
  }
  .del-btn:hover { background: var(--danger-bg); }

  button.primary {
    background: var(--accent); color: var(--accent-ink); border: none;
    padding: 11px 18px; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; width: 100%;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.secondary {
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; width: 100%; margin-top: 10px;
  }

  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--bg); border-top: 1px solid var(--border);
    display: flex; gap: 10px; max-width: 640px; margin: 0 auto;
  }
  .bottom-bar button { margin: 0; }

  .empty {
    text-align: center; padding: 30px 16px; color: var(--ink-soft); font-size: 14px;
  }
  .msg { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-top: 12px; }
  .msg.success { background: var(--success-bg); color: var(--success); }
  .msg.error { background: var(--danger-bg); color: var(--danger); }
  .help { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .help a { color: var(--accent); }
  select { -webkit-appearance: none; appearance: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Deal Monitor</h1>
    <div id="status" class="status disconnected">Not connected</div>
  </header>

  <div id="connect-card" class="card" style="display:none;">
    <h2>Connect to your repo</h2>
    <label for="tok">GitHub Personal Access Token</label>
    <input type="text" id="tok" placeholder="github_pat_...">
    <div class="help">Fine-grained token scoped to this one repo, with <strong>Contents: Read and write</strong> and <strong>Actions: Read and write</strong> permissions. Saved only in this browser — never sent anywhere but GitHub.</div>
    <label for="owner">GitHub username</label>
    <input type="text" id="owner" value="FortifiedDeals">
    <label for="repo">Repository name</label>
    <input type="text" id="repo" value="deal-monitor">
    <button class="primary" style="margin-top:14px" onclick="connect()">Connect</button>
    <div id="connect-msg"></div>
  </div>

  <div id="app" style="display:none;">
    <div class="card">
      <h2>Search area</h2>
      <label for="zips">ZIP codes to check (comma-separated)</label>
      <input type="text" id="zips">
      <label for="radius">Radius (miles)</label>
      <input type="number" id="radius">
    </div>

    <div id="items"></div>
    <button class="secondary" onclick="addItem()">+ Add Item</button>

    <div id="save-msg"></div>
  </div>
</div>

<div class="bottom-bar" id="bottom-bar" style="display:none;">
  <button class="secondary" onclick="runCheckNow()" id="run-btn">Run Check Now</button>
  <button class="primary" onclick="saveChanges()" id="save-btn">Save Changes</button>
</div>

<script>
let state = { owner: '', repo: '', token: '', sha: '', data: null };

function setStatus(text, connected) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status ' + (connected ? 'connected' : 'disconnected');
}

function b64ToUtf8(b64) {
  const bin = atob(b64.replace(/\n/g, ''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

async function gh(path, opts = {}) {
  const res = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}${path}`, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${state.token}`,
      'Accept': 'application/vnd.github+json',
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`${res.status} ${res.statusText}: ${body.slice(0, 200)}`);
  }
  return res.json();
}

async function connect() {
  const tok = document.getElementById('tok').value.trim();
  const owner = document.getElementById('owner').value.trim();
  const repo = document.getElementById('repo').value.trim();
  const msgEl = document.getElementById('connect-msg');
  if (!tok || !owner || !repo) {
    msgEl.innerHTML = '<div class="msg error">Fill in all three fields.</div>';
    return;
  }
  state.token = tok; state.owner = owner; state.repo = repo;
  msgEl.innerHTML = '';
  try {
    await loadWatchlist();
    localStorage.setItem('dm_token', tok);
    localStorage.setItem('dm_owner', owner);
    localStorage.setItem('dm_repo', repo);
    document.getElementById('connect-card').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('bottom-bar').style.display = 'flex';
    setStatus(`${owner}/${repo}`, true);
  } catch (e) {
    msgEl.innerHTML = `<div class="msg error">Couldn't connect: ${e.message}</div>`;
  }
}

async function loadWatchlist() {
  const file = await gh('/contents/watchlist.yaml');
  state.sha = file.sha;
  const text = b64ToUtf8(file.content);
  state.data = jsyaml.load(text) || {};
  if (!state.data.defaults) state.data.defaults = { zip_codes: [], radius_miles: 25 };
  if (!state.data.watchlist) state.data.watchlist = [];
  render();
}

function render() {
  document.getElementById('zips').value = (state.data.defaults.zip_codes || []).join(', ');
  document.getElementById('radius').value = state.data.defaults.radius_miles || 25;

  const container = document.getElementById('items');
  container.innerHTML = '';
  if (state.data.watchlist.length === 0) {
    container.innerHTML = '<div class="card empty">No items yet — add your first one below.</div>';
    return;
  }
  state.data.watchlist.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card item-card';
    card.innerHTML = `
      <div class="item-top">
        <input type="text" value="${escapeAttr(item.name || '')}" oninput="updateItem(${i}, 'name', this.value)" placeholder="Item name">
        <button class="del-btn" onclick="deleteItem(${i})">Remove</button>
      </div>
      <div class="row">
        <div>
          <label>Store</label>
          <select onchange="updateItem(${i}, 'retailer', this.value)">
            <option value="home_depot" ${item.retailer === 'home_depot' ? 'selected' : ''}>Home Depot</option>
            <option value="lowes" ${item.retailer === 'lowes' ? 'selected' : ''}>Lowe's</option>
          </select>
        </div>
        <div>
          <label>Item # (optional)</label>
          <input type="text" value="${escapeAttr(item.product_id || '')}" oninput="updateItem(${i}, 'product_id', this.value)">
        </div>
      </div>
      <label>Search keywords</label>
      <input type="text" value="${escapeAttr(item.keywords || '')}" oninput="updateItem(${i}, 'keywords', this.value)" placeholder="e.g. dewalt cordless drill">
      <div class="row">
        <div>
          <label>Min % off</label>
          <input type="number" value="${item.min_percent_off ?? 0}" oninput="updateItem(${i}, 'min_percent_off', +this.value)">
        </div>
        <div>
          <label>Min $ off</label>
          <input type="number" value="${item.min_dollars_off ?? 0}" oninput="updateItem(${i}, 'min_dollars_off', +this.value)">
        </div>
        <div>
          <label>Target price</label>
          <input type="number" value="${item.target_price ?? 0}" oninput="updateItem(${i}, 'target_price', +this.value)">
        </div>
      </div>
      <div class="check-row">
        <input type="checkbox" id="low-${i}" ${item.low_stock_alert ? 'checked' : ''} onchange="updateItem(${i}, 'low_stock_alert', this.checked)">
        <label for="low-${i}">Alert me on low stock too</label>
      </div>
    `;
    container.appendChild(card);
  });
}

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

function updateItem(i, field, value) {
  state.data.watchlist[i][field] = value;
}

function addItem() {
  state.data.watchlist.push({
    name: '', retailer: 'home_depot', keywords: '', product_id: '',
    min_percent_off: 10, min_dollars_off: 0, target_price: 0, low_stock_alert: false,
  });
  render();
}

function deleteItem(i) {
  if (!confirm(`Remove "${state.data.watchlist[i].name || 'this item'}"?`)) return;
  state.data.watchlist.splice(i, 1);
  render();
}

const FILE_HEADER = `# ============================================================
#  WATCHLIST — managed via the web editor. Manual edits here
#  are fine too; the editor just reads/writes this same format.
# ============================================================

`;

async function saveChanges() {
  state.data.defaults.zip_codes = document.getElementById('zips').value
    .split(',').map(z => z.trim()).filter(Boolean);
  state.data.defaults.radius_miles = +document.getElementById('radius').value || 25;

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const msgEl = document.getElementById('save-msg');
  msgEl.innerHTML = '';

  try {
    const yamlText = FILE_HEADER + jsyaml.dump(state.data, { lineWidth: -1 });
    const result = await gh('/contents/watchlist.yaml', {
      method: 'PUT',
      body: JSON.stringify({
        message: 'Update watchlist via web editor',
        content: utf8ToB64(yamlText),
        sha: state.sha,
      }),
    });
    state.sha = result.content.sha;
    msgEl.innerHTML = '<div class="msg success">Saved. Next check will use these settings.</div>';
  } catch (e) {
    msgEl.innerHTML = `<div class="msg error">Save failed: ${e.message}${e.message.includes('409') ? ' — someone/something else changed the file. Reload the page and reapply your changes.' : ''}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Save Changes';
  }
}

async function runCheckNow() {
  const btn = document.getElementById('run-btn');
  btn.disabled = true; btn.textContent = 'Starting…';
  const msgEl = document.getElementById('save-msg');
  try {
    await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/actions/workflows/deal-check.yml/dispatches`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${state.token}`,
        'Accept': 'application/vnd.github+json',
      },
      body: JSON.stringify({ ref: 'main' }),
    });
    msgEl.innerHTML = '<div class="msg success">Check started — you\'ll get an email in a minute or two.</div>';
  } catch (e) {
    msgEl.innerHTML = `<div class="msg error">Couldn't start the check: ${e.message}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Run Check Now';
  }
}

(function init() {
  const tok = localStorage.getItem('dm_token');
  const owner = localStorage.getItem('dm_owner');
  const repo = localStorage.getItem('dm_repo');
  if (tok && owner && repo) {
    state.token = tok; state.owner = owner; state.repo = repo;
    loadWatchlist().then(() => {
      document.getElementById('app').style.display = 'block';
      document.getElementById('bottom-bar').style.display = 'flex';
      setStatus(`${owner}/${repo}`, true);
    }).catch(e => {
      document.getElementById('connect-card').style.display = 'block';
      document.getElementById('connect-msg').innerHTML = `<div class="msg error">Saved connection failed: ${e.message}. Re-enter your token below.</div>`;
      document.getElementById('owner').value = owner;
      document.getElementById('repo').value = repo;
    });
  } else {
    document.getElementById('connect-card').style.display = 'block';
  }
})();
</script>
</body>
</html>
